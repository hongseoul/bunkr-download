name: Release

# Push a tag like v1.2.0 to build the portable Windows app and the Chrome extension zip
# and attach both to a GitHub release. The tag must match "version" in package.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Check that the tag matches package.json
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") {
            Write-Error "Tag ${{ github.ref_name }} does not match package.json version $version"
            exit 1
          }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run dist
      - run: npm run build:ext
      - name: Zip the Chrome extension
        shell: pwsh
        run: Compress-Archive -Path dist/extension/* -DestinationPath "dist/bunkr-download-extension-${{ github.ref_name }}.zip"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/bunkr-download-*-portable.exe
            dist/bunkr-download-extension-*.zip
          body_path: .github/release-notes.md
          generate_release_notes: true
